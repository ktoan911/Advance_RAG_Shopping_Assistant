services:
  # Neo4j Database
  neo4j:
    image: neo4j:2025.07-enterprise
    container_name: chatbot-neo4j
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=eval
      - NEO4J_AUTH=neo4j/12345678
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
      - ./backend/Data:/backup:ro  # Mount read-only
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "12345678", "CALL db.ping()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${AURA_USERNAME}
      - NEO4J_PASSWORD=${AURA_PASSWORD}
      - AURA_CONNECTION_URI=bolt://neo4j:7687
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LLM_MODEL=${LLM_MODEL}
      - MONGO_URI=${MONGO_URI}
      - LOCATION_URL=${LOCATION_URL}
      - API_KEY=${API_KEY}
      - DB_NAME=${DB_NAME}
      - COLLECTION_NAME=${COLLECTION_NAME}
      - WEBSITE=${WEBSITE}
      - MAX_INPUT_TOKEN=${MAX_INPUT_TOKEN}
      - AURA_USERNAME=${AURA_USERNAME}
      - AURA_PASSWORD=${AURA_PASSWORD}
    ports:
      - "5000:5000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/models:/app/models
      - ./backend/Embedding:/app/Embedding
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  chatbot-network:
    driver: bridge